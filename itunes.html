<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iTunes | Aurora GIFTBOX</title><link rel="stylesheet" href="aurora.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><h1 style="font-family:Georgia,serif;font-weight:400">iTunes</h1><div class="gift-guidance"><p>💡受け取り完了後は🎁ボタンを押してください</p><small>（受け取り済みの表示に変わったらOK）</small><p class="warning">⚠️未受け取りがある場合は専用ノートへ追加をお願いします</p></div><div class="toolbar"><a href="index.html" class="subtle">← ノート一覧</a><button class="primary" id="add">＋ ギフトを追加</button></div><div id="list"><p class="subtle">読み込み中…</p></div><div class="pages"><button class="secondary" id="prev">前へ</button><button class="secondary" id="next">次へ</button></div><div style="text-align:center;margin-top:12px"><button class="secondary" id="backToList" type="button">↑ 一覧の先頭に戻る</button></div><div class="overlay" id="overlay"><div class="modal"><h3>ギフトを追加</h3><textarea id="content" placeholder="ギフトコードを貼り付け"></textarea><div class="paste-row"><button type="button" class="secondary" id="paste">ペースト</button></div><p class="status" id="msg"></p><div class="modal-buttons"><button class="secondary" id="cancel">閉じる</button><button class="primary" id="submit">投稿する</button></div></div></div></main><script>const db=supabase.createClient(GIFTBOX_CONFIG.supabaseUrl,GIFTBOX_CONFIG.supabaseKey);const labels={itunes:"iTunes",recochoku:"レコチョク",mumo:"mu-mo",unreceived:"未受け取り"};const PAGE_SIZE=50;const fmt=d=>new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(d));function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};const SERVICE="itunes";let page=0,busy=false;const list=document.getElementById("list");function linkify(text){const re=/https?:\/\/[^\s<>]+/g;const frag=document.createDocumentFragment();let start=0,m;while((m=re.exec(text))){frag.append(document.createTextNode(text.slice(start,m.index)));try{const u=new URL(m[0]);if(["https:","http:"].includes(u.protocol)){const a=el("a","",m[0]);a.href=u.href;a.target="_blank";a.rel="noopener noreferrer";frag.append(a)}else frag.append(document.createTextNode(m[0]))}catch{frag.append(document.createTextNode(m[0]))}start=re.lastIndex}frag.append(document.createTextNode(text.slice(start)));return frag}async function load(){list.textContent="読み込み中…";const {data,error}=await db.from("gifts").select("id,service,gift_type,content,created_at,reacted").eq("service",SERVICE).order("created_at",{ascending:false}).order("id",{ascending:false}).range(page*PAGE_SIZE,(page+1)*PAGE_SIZE);list.textContent="";if(error){list.textContent="読み込みに失敗しました: "+error.message;return}if(!data.length){list.textContent=page?"このページには投稿がありません":"まだ投稿がありません";if(page){page--;return load()}}for(const item of data){const card=el("article","note");const top=el("div","note-top");top.append(el("time","",fmt(item.created_at)));if(SERVICE==="unreceived")top.append(el("span","",labels[item.gift_type]));const content=el("div","note-content");content.append(linkify(item.content));const mainRow=el("div","note-main");const action=el("button","secondary",item.gift_type==="itunes"?"コピー":"リンクを開く");action.onclick=async()=>{if(item.gift_type==="itunes"){try{await navigator.clipboard.writeText(item.content);action.textContent="コピー"}catch{action.textContent="コピー失敗"}}else{const match=item.content.match(/https?:\/\/[^\s<>]+/);if(match){const u=new URL(match[0]);if(["https:","http:"].includes(u.protocol))window.open(u.href,"_blank","noopener,noreferrer")}else action.textContent="URLが見つかりません"}};const smile=el("button","smile"+(item.reacted?" on":""),"");function renderReceipt(){smile.replaceChildren();const mark=el("span","checkmark",item.reacted?"✓":"🎁");const label=el("span","receipt-label","受け取り済み");smile.append(mark,label)}renderReceipt();smile.setAttribute("aria-label","受け取り済みを切り替える");smile.setAttribute("aria-pressed",String(!!item.reacted));smile.onclick=async()=>{smile.disabled=true;const {data,error}=await db.rpc("toggle_gift_reaction",{p_gift_id:item.id});smile.disabled=false;if(error){alert("切り替えに失敗しました");return}item.reacted=data;smile.className="smile"+(data?" on":"");renderReceipt();smile.setAttribute("aria-pressed",String(!!data))};mainRow.append(content,action);card.append(top,mainRow,smile);list.append(card)}document.getElementById("prev").disabled=page===0;document.getElementById("next").disabled=data.length<PAGE_SIZE}document.getElementById("prev").onclick=()=>{if(page){page--;load();list.scrollIntoView({block:"start"})}};document.getElementById("next").onclick=()=>{page++;load();list.scrollIntoView({block:"start"})};document.getElementById("backToList").onclick=()=>list.scrollIntoView({behavior:"smooth",block:"start"});const overlay=document.getElementById("overlay");document.getElementById("add").onclick=()=>overlay.classList.add("open");document.getElementById("cancel").onclick=()=>overlay.classList.remove("open");document.getElementById("paste").onclick=async()=>{const field=document.getElementById("content"),msg=document.getElementById("msg");try{const value=await navigator.clipboard.readText();if(!value){msg.textContent="クリップボードが空です";return}field.value=value;msg.textContent=""}catch{msg.textContent="ブラウザで貼り付けが許可されていません。入力欄を長押しして貼り付けてください"}};document.getElementById("submit").onclick=async()=>{if(busy)return;const content=document.getElementById("content").value.trim();const msg=document.getElementById("msg");if(!content||content.length>10000){msg.textContent="1〜10000文字で入力してください";return}const kind=SERVICE==="unreceived"?document.getElementById("kind").value:SERVICE;busy=true;document.getElementById("submit").disabled=true;const {error}=await db.from("gifts").insert({service:SERVICE,gift_type:kind,content});busy=false;document.getElementById("submit").disabled=false;if(error){msg.textContent="投稿できませんでした: "+error.message;return}document.getElementById("content").value="";msg.textContent="";overlay.classList.remove("open");page=0;load()};load();document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});setInterval(()=>{if(!document.hidden&&!overlay.classList.contains("open"))load()},30000);</script></body></html>
