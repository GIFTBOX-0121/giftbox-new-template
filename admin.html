<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理 | Aurora GIFTBOX</title><link rel="stylesheet" href="aurora.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><header><a href="index.html"><b>GIFTBOX</b> <span class="eyebrow">/ AURORA</span></a><span class="eyebrow">STARGLOW</span></header><h1>GIFTBOX 管理</h1><section id="login" class="panel"><p>管理者ログイン</p><input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード" style="margin-top:10px"><div class="toolbar"><span class="status" id="loginerr"></span><button class="primary" id="loginbtn">ログイン</button></div></section><section id="dashboard" class="hide"><div class="toolbar"><strong>累計 <span id="total">0</span> 件</strong><button class="secondary" id="logout">ログアウト</button></div><h2>日別集計</h2><div id="daily"></div><h2>サービス × 日付</h2><div class="scroll panel" id="matrix"></div><p class="subtle">未受取ノートは集計に含みません。</p></section></main><script>const db=supabase.createClient(GIFTBOX_CONFIG.supabaseUrl,GIFTBOX_CONFIG.supabaseKey);const labels={itunes:"iTunes",recochoku:"レコチョク",mumo:"mu-mo",unreceived:"未受取ノート"};const PAGE_SIZE=20;const fmt=d=>new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(d));function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};const login=document.getElementById("login"),dash=document.getElementById("dashboard");async function verify(){const {data:{user}}=await db.auth.getUser();if(!user){login.classList.remove("hide");dash.classList.add("hide");return}const {data, error}=await db.from("gift_admins").select("user_id").eq("user_id",user.id).maybeSingle();if(error||!data){login.classList.remove("hide");dash.classList.add("hide");document.getElementById("loginerr").textContent="管理者として登録されていません";return}login.classList.add("hide");dash.classList.remove("hide");stats()}document.getElementById("loginbtn").onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});if(error){document.getElementById("loginerr").textContent="ログインできませんでした";return}verify()};document.getElementById("logout").onclick=async()=>{await db.auth.signOut();verify()};async function stats(){const {data,error}=await db.from("gift_daily_stats").select("stat_date,service,gift_count").order("stat_date",{ascending:false}).limit(10000);if(error){document.getElementById("daily").textContent="集計を取得できません: "+error.message;return}const dates=[...new Set(data.map(x=>x.stat_date))].sort().reverse(),services=["itunes","recochoku","mumo"],counts={};for(const x of data)counts[x.stat_date+"|"+x.service]=Number(x.gift_count);const count=(d,s)=>counts[d+"|"+s]||0;const sum=xs=>xs.reduce((a,b)=>a+b,0);document.getElementById("total").textContent=sum(data.map(x=>Number(x.gift_count))).toLocaleString();const daily=document.getElementById("daily");daily.textContent="";for(const d of dates){const card=el("div","note");card.append(el("strong","",d));for(const s of services)card.append(el("p","subtle",labels[s]+"： "+count(d,s)+"件"));card.append(el("strong","","合計 "+sum(services.map(s=>count(d,s)))+"件"));daily.append(card)}const matrix=document.getElementById("matrix");matrix.textContent="";const table=el("table"),head=el("tr");head.append(el("th","","サービス"));for(const d of dates)head.append(el("th","",d));head.append(el("th","","合計"));table.append(head);for(const s of services){const tr=el("tr");tr.append(el("th","",labels[s]));for(const d of dates)tr.append(el("td","",String(count(d,s))));tr.append(el("td","",String(sum(dates.map(d=>count(d,s))))));table.append(tr)}const tr=el("tr");tr.append(el("th","","合計"));for(const d of dates)tr.append(el("td","",String(sum(services.map(s=>count(d,s))))));tr.append(el("td","",document.getElementById("total").textContent));table.append(tr);matrix.append(table)}verify();</script></body></html>
